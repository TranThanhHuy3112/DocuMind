<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DocuMind Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone frame centred, with a guide column beside it on desktop; full-bleed on phones. */
:root{
  --bg:#ECE6F0; --app:#F6F2F8; --surface:#FFFFFF; --surface2:#EFE8F3;
  --fg:#1C1829; --muted:#686277; --line:#DED6E4;
  --a-l:#4B3FC9; --a-d:#B1A8FF; --accent:var(--a-l); --on-accent:#FFFFFF;
  --accent-soft:color-mix(in srgb,var(--accent) 13%,var(--surface));
  --ok:#17744A; --danger:#B3281C;
  --shadow:0 24px 64px rgba(48,30,84,.20);
  --gap:14px; --cardpad:16px;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-accent="blue"]{--a-l:#1F63C6;--a-d:#8DB9FF}
:root[data-accent="green"]{--a-l:#17744A;--a-d:#74DBA6}
:root[data-accent="pink"]{--a-l:#B2306B;--a-d:#FFA1C7}
:root[data-density="compact"]{--gap:8px;--cardpad:11px}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0910; --app:#141119; --surface:#1D1926; --surface2:#262033;
    --fg:#EFEBF7; --muted:#A59FB7; --line:#2E2940;
    --accent:var(--a-d); --on-accent:#17112F; --ok:#6FD6A0; --danger:#FF8F80;
    --shadow:0 24px 64px rgba(0,0,0,.55); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0910; --app:#141119; --surface:#1D1926; --surface2:#262033;
  --fg:#EFEBF7; --muted:#A59FB7; --line:#2E2940;
  --accent:var(--a-d); --on-accent:#17112F; --ok:#6FD6A0; --danger:#FF8F80;
  --shadow:0 24px 64px rgba(0,0,0,.55); color-scheme:dark;
}
*{box-sizing:border-box}
html{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none;display:block}

.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.guide{width:300px;display:flex;flex-direction:column;gap:18px}
.guide h2{font-size:22px;letter-spacing:-.02em;font-weight:800;text-wrap:balance}
.guide p,.guide li{color:var(--muted);font-size:13.5px}
.guide h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
.guide ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.phone{position:relative;width:392px;max-width:100%;height:min(820px,calc(100dvh - 48px));background:var(--app);border:1px solid var(--line);border-radius:32px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;flex:none}

.appbar{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(180deg,var(--app) 70%,transparent);transition:background .2s,box-shadow .2s}
.appbar.scrolled{background:color-mix(in srgb,var(--app) 74%,transparent);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);box-shadow:0 1px 0 var(--line)}
.cpick{display:flex;flex-direction:column;gap:6px}
.cp{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:13.5px;font-weight:600}
.cp .ck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:var(--on-accent)}
.cp.on{border-color:var(--accent);background:var(--accent-soft)}.cp.on .ck{background:var(--accent);border-color:var(--accent)}
.cp .tr{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.screen.nonav{padding-bottom:20px}
.screen.nonav .composer2{bottom:14px}
.screen.notop{padding-top:18px!important}
.avbtn{border:0;background:transparent;padding:0;border-radius:50%;flex:none}
.avbtn .av{width:40px;height:40px;font-size:16px}
.gsearch{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 82%,transparent);color:var(--muted);text-align:left;font-size:13.5px}
.greet{flex:1;min-width:0}
.greet b{display:block;font-size:18px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsearch span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bellbtn{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 82%,transparent);display:grid;place-items:center;flex:none;color:var(--fg)}
.badge-n{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:var(--on-accent);font:700 11px/18px var(--font);font-style:normal;text-align:center}
.sheet.top{align-items:flex-start}
.sheet.top .panel{border-radius:0 0 24px 24px;padding-top:16px;max-height:86%}
.gsec{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:10px 4px 2px}
.gsrow,.nrow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;text-align:left;padding:10px 6px;border-radius:12px}
.gsrow:hover,.nrow:hover{background:var(--accent-soft)}
.gsrow .badge{width:38px;height:38px;font-size:10px}
.gsrow b,.nrow b{display:block;font-size:13.5px;font-weight:600}
.gsrow .tr{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsrow small,.nrow small{display:block;color:var(--muted);font-size:12px}
.nrow{align-items:flex-start}
.nrow.unread{background:var(--accent-soft)}
.nrow .ni{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.nrow.unread .ni{background:var(--surface)}
.udot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.brand{min-width:0;flex:1}
.brand b{display:block;font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.brand small{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:38px;height:38px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--fg);flex:none}
.icon-btn:hover{background:var(--accent-soft)}
.icon-btn.danger:hover{color:var(--danger)}

.screen{flex:1;min-height:0;overflow-y:auto;padding:72px 16px 112px;display:flex;flex-direction:column;gap:var(--gap)}
[hidden]{display:none!important}
.screen>*{flex-shrink:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
h1{font-size:26px;line-height:1.15;letter-spacing:-.02em;font-weight:800;text-wrap:balance;margin-bottom:8px}
h2.vt{font-size:18px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:var(--cardpad)}
.note{display:flex;align-items:flex-start;gap:8px;background:var(--accent-soft);border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--fg)}
.note span{flex:1}
.note button{border:0;background:transparent;font-size:18px;line-height:1;padding:0 4px;color:var(--muted)}
.small{font-size:12px;color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .si{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:6px}
.stat b{font-size:24px;line-height:1.1;font-weight:800;font-variant-numeric:tabular-nums}
.stat b.ok{font-size:15px;color:var(--ok);padding-top:6px;padding-bottom:3px}
.stat small{color:var(--muted);font-size:12px}

.upload{border:1.5px solid color-mix(in srgb,var(--accent) 55%,var(--line));text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 16px}
.upload .big{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.upload h3{font-size:16px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:700;padding:12px 20px;font-size:14px}
.btn:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.6;cursor:default}
.btn.sm{padding:9px 14px;font-size:13px;border-radius:12px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line))}
.btn.ghost:hover{background:var(--accent-soft);filter:none}
.btn.warn{background:var(--danger);color:#fff}
.accent-t{color:var(--accent);font-weight:700;font-size:13px}

.sect{font-size:17px;font-weight:800;letter-spacing:-.01em;margin-top:4px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.tool:hover:not([aria-disabled="true"]){border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.tool .ti{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:6px}
.tool b{font-size:14px;font-weight:700}
.tool small{color:var(--muted);font-size:12px;line-height:1.35}
.tool[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.tool .need{color:var(--danger);font-size:11.5px;font-weight:600;margin-top:2px}

.row{display:flex;align-items:center;gap:10px}
.row.sb{justify-content:space-between}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:12px 0;outline:0;color:var(--fg)}
.search:focus-within{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px}
.segb{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;border-radius:999px;padding:9px 10px;font-size:13.5px;font-weight:600;color:var(--muted)}
.segb[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px color-mix(in srgb,var(--fg) 14%,transparent)}
.big-ic{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.chip[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
select,.field input,.field textarea,.composer input{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
select{appearance:auto}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field textarea{color:var(--fg);font-weight:400;font-size:14px}
.field textarea{min-height:96px;resize:vertical}

.doc{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:var(--cardpad)}
.badge{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:800;letter-spacing:.04em;flex:none}
.dmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dmeta h3{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmeta p,.dmeta small{font-size:12px;color:var(--muted)}
.meter{height:4px;border-radius:2px;background:var(--accent);margin:4px 0 2px}
.list{display:flex;flex-direction:column;gap:var(--gap)}
.lib-top{display:flex;gap:10px;align-items:stretch}
.lib-top .search{flex:1;min-width:0}
.add-btn{width:48px;border-radius:14px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none;cursor:pointer}
.add-btn:hover{filter:brightness(1.07)}
.add-btn.sm{width:36px;height:36px;border-radius:12px}
.fscroll{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none}
.fscroll::-webkit-scrollbar{display:none}
.fscroll .chip{flex:none;white-space:nowrap}
.lib-meta{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sortsel{width:auto;padding:6px 12px;font-size:12.5px;font-weight:600;border-radius:999px}
.dots{display:inline-flex;gap:4px}
.dots i{width:16px;height:6px;border-radius:3px;background:var(--surface2);border:1px solid var(--line)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.doc2{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:var(--cardpad);display:flex;flex-direction:column;gap:10px}
.doc2 .top{display:flex;align-items:center;gap:12px}
.doc2 .badge{width:42px;height:42px}
.okt{color:var(--ok);font-weight:600}
.dtools{display:flex;gap:8px;flex-wrap:wrap}
.dt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--accent)}
.dt:hover{background:var(--accent-soft)}
.dt{align-self:flex-start}
.dt[aria-expanded="true"]{background:var(--accent-soft)}
.dt[aria-expanded="true"] .ic:last-child{transform:rotate(180deg)}
.menu{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface2)}
.mrow{display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;padding:10px 12px}
.mrow+.mrow{border-top:1px solid var(--line)}
.mrow:hover{background:var(--accent-soft)}
.mrow .mi{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.mrow b{display:block;font-size:13.5px;font-weight:700}
.mrow small{color:var(--muted);font-size:12px}
.mrow .ic{color:var(--accent)}
.icard{padding:4px 0}
.irow+.irow{border-top:1px solid var(--line)}
.ihead{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;text-align:left;padding:12px 16px}
.ihead .mi{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.ihead .it{flex:1;min-width:0}
.ihead b{display:block;font-size:14px;font-weight:700}
.ihead small{color:var(--muted);font-size:12px}
.ihead>.ic:last-child{color:var(--muted);transition:transform .2s}
.ihead[aria-expanded="true"]>.ic:last-child{transform:rotate(180deg)}
.ibody{padding:2px 16px 16px;display:flex;flex-direction:column;gap:12px}
.mail{overflow-wrap:anywhere;font-size:14px}
.faq+.faq{border-top:1px solid var(--line)}
.fq{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:10px 0;font-weight:600;font-size:13.5px}
.fq .ic{color:var(--muted);transition:transform .2s;flex:none}
.fq[aria-expanded="true"] .ic{transform:rotate(180deg)}
.ans{padding:0 0 10px;font-size:13px;color:var(--muted);white-space:pre-line}
.about-top{display:flex;align-items:center;gap:12px}
.ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.aiwrap{flex:1 0 auto;display:flex;flex-direction:column;gap:14px}
.docpick{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:2px 12px;color:var(--accent)}
.docpick select{border:0;background:transparent;padding:10px 0;font-weight:600;color:var(--fg);flex:1;min-width:0;width:auto;outline:0}
.aichat{flex:1;display:flex;flex-direction:column;gap:12px}
.ai-empty{margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 12px;color:var(--muted)}
.ai-empty b{color:var(--fg);font-size:16px}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg.u{justify-content:flex-end}
.msg .bubble{align-self:auto}
.aiav{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.src{font-size:11.5px;color:var(--muted);margin:4px 0 0 2px}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
.composer2{position:sticky;bottom:90px;display:flex;gap:8px;align-items:center;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 16px;box-shadow:0 6px 18px color-mix(in srgb,var(--fg) 10%,transparent)}
.composer2 input{flex:1;min-width:0;border:0;background:transparent;outline:0;padding:8px 0;color:var(--fg)}
.send{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.tagsel{display:flex;flex-direction:column;gap:8px}
.tagbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:11px 12px;font-weight:600;font-size:13.5px}
.tagbtn .tl,.tagbtn .tv{display:inline-flex;align-items:center;gap:8px}
.tagbtn .tv{color:var(--accent)}
.tagbtn[aria-expanded="true"]{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.tagbtn[aria-expanded="true"] .tv .ic:last-child{transform:rotate(180deg)}
.empty{text-align:center;color:var(--muted);padding:22px 12px;display:flex;flex-direction:column;gap:10px;align-items:center}

.viewhead{display:flex;align-items:center;gap:10px}
.bubble{max-width:88%;padding:10px 13px;border-radius:16px;font-size:13.5px;white-space:pre-wrap}
.bubble.u{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:5px}
.bubble.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.chat{display:flex;flex-direction:column;gap:8px}
.composer{display:flex;gap:8px}
.composer input{flex:1}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.tile small{display:block;font-size:11px;color:var(--muted)}
.tile b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.tile span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar{fill:color-mix(in srgb,var(--accent) 42%,var(--surface))}
.chart .bar.best{fill:var(--accent)}
.chart text{fill:var(--muted);font:600 10px var(--font);text-anchor:middle}
.chart text.val{fill:var(--fg)}

async function addFile(f){
 var ext=(f.name.split('.').pop()||'').toLowerCase();var type=TYPE[ext];
 if(!type){toast('Định dạng .'+ext+' chưa được hỗ trợ.');return}
 var text=null;
 if(ext==='txt'||ext==='csv'){try{text=(await f.text()).slice(0,200000)}catch(e){}}
 addDoc({name:f.name,ext:ext,type:type,size:f.size,text:text});
}

/* ---------- analysis helpers ---------- */
function splitLine(l,d){var out=[],cur='',q=false;for(var i=0;i<l.length;i++){var ch=l[i];if(ch==='"')q=!q;else if(ch===d&&!q){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(function(s){return s.trim()})}
function toNum(v){var s=String(v).replace(/\s/g,'');if(!s)return null;var n=Number(s.replace(',','.'));return isFinite(n)?n:null}
function analyze(text){
 var lines=String(text).split(/\r?\n/).filter(function(l){return l.trim()});
 if(lines.length<2)return null;
 var d=lines[0].split(';').length>lines[0].split(',').length?';':',';
 var rows=lines.map(function(l){return splitLine(l,d)});var head=rows[0];rows=rows.slice(1);
 var vc=-1;
 for(var c=head.length-1;c>=1;c--){var ok=rows.filter(function(r){return toNum(r[c])!==null}).length;if(ok>=rows.length*0.8){vc=c;break}}
 if(vc<1)return null;
 var bk={},bc={},ko=[];
 rows.forEach(function(r){var v=toNum(r[vc]);if(v===null)return;if(!(r[0] in bk)){bk[r[0]]=0;ko.push(r[0])}bk[r[0]]+=v;if(vc>=2){bc[r[1]]=(bc[r[1]]||0)+v}});
 var byKey=ko.map(function(k){return [k,bk[k]]});
 var byCat=Object.keys(bc).map(function(k){return [k,bc[k]]}).sort(function(a,b){return b[1]-a[1]});
 var total=byKey.reduce(function(a,b){return a+b[1]},0);
 return {valueName:head[vc],keyName:head[0],catName:vc>=2?head[1]:null,byKey:byKey,byCat:byCat,total:total};
}
function chartSVG(data){
 var W=320,H=190,pl=8,pr=8,pt=22,pb=26,max=Math.max.apply(null,data.map(function(d){return d[1]}));
 var bw=(W-pl-pr)/data.length,best=data.map(function(d){return d[1]}).indexOf(max),g='',b='';
 for(var i=0;i<=3;i++){var y=pt+(H-pt-pb)*i/3;g+='<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'"/>'}
 data.forEach(function(d,i){
  var h=(H-pt-pb)*d[1]/max,x=pl+i*bw+bw*0.18,w=bw*0.64,y=H-pb-h;
  b+='<rect class="bar'+(i===best?' best':'')+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="4"/>';
  b+='<text class="val" x="'+(x+w/2).toFixed(1)+'" y="'+(y-5).toFixed(1)+'">'+fmtNum(d[1])+'</text>';
  b+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-8)+'">'+esc(d[0])+'</text>';
 });
 return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Biểu đồ cột theo '+esc(data.length)+' kỳ">'+g+b+'</svg>';
}

/* ---------- answers ---------- */
function answer(doc,q){
 var ss=sents(textOf(doc));
 if(/tom tat|tong quan/.test(norm(q)))return ss.slice(0,3).join(' ');
 var qw=words(q);if(!qw.length)return 'Bạn hãy hỏi cụ thể hơn một chút nhé.';
 var sc=ss.map(function(s,i){var sw=words(s),n=0;qw.forEach(function(w){if(sw.indexOf(w)>=0)n++});return {i:i,n:n,s:s}});
 var best=Math.max.apply(null,sc.map(function(x){return x.n}));
 var top=sc.filter(function(x){return x.n>0&&x.n>=best*0.6}).sort(function(a,b){return b.n-a.n}).slice(0,2).sort(function(a,b){return a.i-b.i});
 if(!top.length)return 'Mình không thấy nội dung liên quan trong tệp này.';
 return top.map(function(x){return x.s}).join(' ');
}

function render(){

 var sc=$('#screen'),keep={},top=sc.scrollTop;
 sc.querySelectorAll('input[id],textarea[id]').forEach(function(i){keep[i.id]=i.value});
 var showTop=S.authed&&!S.view&&S.tab!=='account';
 $('#appbar').hidden=!showTop;$('#tabs').hidden=!S.authed||!!S.view;sc.classList.toggle('nonav',!!S.view);sc.classList.toggle('authv',!S.authed);
 $('#appbar').innerHTML=showTop?appbar():'';
 sc.classList.toggle('notop',!showTop);
 $('#tabs').innerHTML=S.authed?tabs():'';
 var h;
 if(!S.authed)h=login();
 else if(S.view){var v=S.view;h=v==='ai'?vAI():v==='analyze'?vAnalyze():v==='transcribe'?vTranscribe():vOutline()}
 else h=S.tab==='home'?home():S.tab==='library'?library():S.tab==='community'?community():account();
 var key=S.authed?S.tab+'|'+(S.view||''):'login';
 sc.innerHTML=h;
 sc.querySelectorAll('input[id],textarea[id]').forEach(function(i){if(i.id!=='q'&&i.id!=='em'&&i.id!=='pw'&&i.id!=='nameIn'&&(i.id in keep))i.value=keep[i.id]});
 sc.scrollTop=S.stick?sc.scrollHeight:(key===lastKey?top:0);
 S.stick=false;lastKey=key;
 $('#appbar').classList.toggle('scrolled',sc.scrollTop>10);
 $('#sheet').innerHTML=sheetHTML();
}

  if(ac&&ac.pw!==p){E('Mật khẩu không đúng.');return}
  var rm=$('#rem');saveCred(e,p,rm&&rm.checked);
  S.user.email=e;if(ac)S.user.name=ac.name;S.authed=true;S.tab='home';S.view=null;S.auth={mode:'login',email:S.remember?e:'',err:''};render();
 },
 verified:function(){var e=S.auth.email,ac=S.accounts[e];S.user.email=e;if(ac)S.user.name=ac.name;S.authed=true;S.tab='home';S.view=null;S.auth={mode:'login',email:'',err:''};render();toast('Email đã được xác minh. Chào mừng bạn!')},
 resend:function(){toast('Đã gửi lại thư xác minh.')}
};
function loadSaved(){try{var v=JSON.parse(localStorage.getItem('dm_cred')||'null');if(v&&v.e){S.saved=v;S.remember=true;S.auth.email=v.e}}catch(x){}}
function saveCred(e,p,on){try{if(on){localStorage.setItem('dm_cred',JSON.stringify({e:e,p:p}));S.saved={e:e,p:p}}else{localStorage.removeItem('dm_cred');S.saved=null}}catch(x){}S.remember=!!on}
function postBy(id){return S.posts.filter(function(p){return p.id===id})[0]}
function doAsk(q){
 var d=byId(S.chat.docId);if(!d||S.chat.typing)return;
 S.chat.msgs.push({r:'u',t:q});S.chat.typing=true;S.stick=true;render();
 setTimeout(function(){
  S.chat.typing=false;
  if(S.view==='ai'&&byId(S.chat.docId)===d)S.chat.msgs.push({r:'a',t:answer(d,q),src:d.name});
  S.stick=true;render();
 },700);
}

document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;
 var a=el.getAttribute('data-act');
 if(a==='pick')return; /* label opens the file picker natively */
 if(el.getAttribute('aria-disabled')==='true'&&a==='tool'){ACT.tool(el,el.getAttribute('data-id'));return}
 if(ACT[a])ACT[a](el,el.getAttribute('data-id'),e);
});
document.addEventListener('keydown',function(e){
 if(e.key==='Enter'&&e.target.getAttribute){
  var a=e.target.getAttribute('data-enter');
  if(a&&ACT[a]){e.preventDefault();ACT[a](e.target,e.target.getAttribute('data-id'),e);return}
  if(e.target.tagName==='LABEL'&&(e.target.htmlFor==='file'||e.target.htmlFor==='pfile')){e.preventDefault();$('#'+e.target.htmlFor).click()}
 }
 if(e.key==='Escape'&&(S.sheet||S.panel)){S.sheet=null;S.panel=null;render()}
});
document.addEventListener('input',function(e){
 if(e.target.id==='q'){S.q=e.target.value;renderList()}
 else if(e.target.id==='pw'&&S.auth.mode==='register'){var k=strength(e.target.value),bars=document.querySelectorAll('.pwm b');for(var z=0;z<bars.length;z++)bars[z].className=z<k?'on l'+k:'';var t=$('#mtxt');if(t)t.textContent=k?'Độ mạnh: '+['','Yếu','Trung bình','Khá','Mạnh'][k]:''}
 else if(e.target.id==='gs'){S.gq=e.target.value;$('#gsr').innerHTML=searchResults()}
});
document.addEventListener('change',function(e){
 var b=e.target.getAttribute&&e.target.getAttribute('data-bind');if(!b)return;var v=e.target.value;
 if(b==='sort'){S.sort=v;renderList()}
 else if(b==='chatDoc'){S.chat.docId=+v;S.chat.msgs=[];S.chat.typing=false;render()}
 else if(b==='anDoc'){S.an.docId=+v;render()}
 else if(b==='trDoc'){S.tr={docId:+v,status:'idle'};render()}
 else if(b==='olDoc'){S.ol.docId=+v;render()}
});
$('#file').addEventListener('change',async function(e){
 var fs=Array.prototype.slice.call(e.target.files);
 for(var i=0;i<fs.length;i++)await addFile(fs[i]);
 e.target.value='';
});
$('#afile').addEventListener('change',function(e){var f=e.target.files[0];e.target.value='';if(!f)return;if(!/^image\//.test(f.type)){toast('Hãy chọn một tệp ảnh.');return}
 var u=URL.createObjectURL(f),im=new Image();im.onload=function(){var c=document.createElement('canvas');c.width=c.height=192;var x=c.getContext('2d'),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,192,192);S.user.photo=c.toDataURL('image/jpeg',.85);URL.revokeObjectURL(u);toast('Đã cập nhật ảnh đại diện.');render()};im.onerror=function(){toast('Không đọc được ảnh này.')};im.src=u});
$('#pfile').addEventListener('change',function(e){
 if(!S.sheet){e.target.value='';return}
 var t=$('#pt');if(t)S.sheet.text=t.value;
 Array.prototype.slice.call(e.target.files).forEach(function(f){
  if(S.sheet.files.length>=4){toast('Mỗi bài chỉ đính kèm tối đa 4 tệp.');return}
  if(f.size>10485760){toast(f.name+' lớn hơn 10 MB.');return}
  var ext=(f.name.split('.').pop()||'').toLowerCase(),img=/^image\//.test(f.type);
  var rec={name:f.name,ext:ext||'file',kind:img?'image':'file',size:f.size,url:img?URL.createObjectURL(f):null};
  if(/^(txt|csv|md|json)$/.test(ext)&&f.size<200000){try{var fr=new FileReader();fr.onload=function(){rec.text=String(fr.result).slice(0,4000)};fr.readAsText(f)}catch(x){}}
  S.sheet.files.push(rec);
 });
 e.target.value='';renderSheet();
});
if(mq&&mq.addEventListener)mq.addEventListener('change',function(){if(S.theme==='system')render()});

$('#screen').addEventListener('scroll',function(){$('#appbar').classList.toggle('scrolled',this.scrollTop>10)},{passive:true});
addDoc(SAMPLES[0],true);addDoc(SAMPLES[1],true);
loadSaved();render();
})();
</script>
